[project]
name = "job-scraper"
version = "0.1.0"
description = "KOIS Phase 1 foundation and ingestion pipeline"
authors = [{ name = "Daniel Sørenes", email = "daniel@kynd.no" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=1.10.0",
    "playwright>=1.51.0",
    "psycopg[binary]",
    "pydantic>=2.11.3",
    "pydantic-settings",
    "python-dotenv>=1.1.0",
    "sqlalchemy",
    "slack-sdk>=3.35.0",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff==0.16.5",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["job_scraper*"]

[tool.setuptools.package-data]
"job_scraper.kois" = ["templates/*.html"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["build", "*.egg-info"]

[tool.ruff.lint.per-file-ignores]
# FastAPI Depends()/Form() in defaults is the documented injection pattern.
"job_scraper/kois/review_api.py" = ["B008"]

