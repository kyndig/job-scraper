{% extends "base.html" %}
{% block title %}KOIS login{% endblock %}
{% block content %}
  <h1>Operator login</h1>
  <p class="muted">Enter the review token configured as KOIS_REVIEW_TOKEN.</p>
  {% if error %}
    <p>Invalid token.</p>
  {% endif %}
  <form method="post" action="/ui/login" class="card">
    <label>
      Token
      <input type="password" name="token" required>
    </label>
    <p><button type="submit">Continue</button></p>
  </form>
{% endblock %}
